[package]
name = "seum-standard-cw"
version = "3.1.0"
authors = ["okneo31 (안재현)"]
edition = "2021"
description = "SeumStandard v3.1 — CosmWasm contract for Zion. 3축 명예 + 행동 게이트 + 안식일 + 봉사 복리 + 자본보너스. 컨트랙트 v3.1 (Solidity)와 비트 동일 로직."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = true

[features]
backtraces = ["cosmwasm-std/backtraces"]
library = []

[dependencies]
cosmwasm-std = { version = "1.5", features = ["staking"] }
cosmwasm-schema = "1.5"
cw-storage-plus = "1.2"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
schemars = "0.8"

[dev-dependencies]
cw-multi-test = "1.2"
